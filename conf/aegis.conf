# ============================================================
# AEGIS 主配置 (Lua 防护层读取)
# 修改后执行: sudo nginx -s reload  或  systemctl restart nginx
# ============================================================

# ---- 全局开关 ----
enable_waf            on            # Web 攻击检测 (SQLi/XSS/命令注入等)
enable_rate_limit     on            # 单 IP 限流
enable_flow_breaker   on            # 全局熔断 (CC/洪水)
enable_challenge      on            # JS 工作量证明挑战 (拦截无头机器人)
enable_blacklist      on            # 静态+动态黑名单
enable_bot_ua         on            # 恶意爬虫/扫描器 UA 拦截
enable_slow_guard     on            # 慢速攻击防护 (配合 nginx 配置)
enable_body_check     on            # 请求体内容检测 (POST 数据)

# ---- 白名单 (永不拦截，CIDR 或单 IP，逗号分隔) ----
# 建议放行: 监控探针、办公出口、CDN 回源
whitelist_ips         ""

# ---- 静态黑名单 (文件: conf/blacklist.txt，每行一个 IP/CIDR) ----
blacklist_file        "/opt/aegis/conf/blacklist.txt"

# ---- 单 IP 限流 ----
# 窗口 5 秒内允许 N 次请求，超过则临时封禁 ban_sec 秒
rate_window_sec       5
rate_max_reqs         80
rate_ban_sec          120
# 登录/认证接口单独限流（撞库/爆破防护；路径前缀逗号分隔，匹配即用更严阈值）
login_paths           "/login,/signin,/auth,/api/login"
login_window_sec      60
login_max_reqs        10
login_ban_sec         1800

# ---- 全局熔断 (CC/HTTP Flood) ----
# 无签名 Cookie 流量达到以下阈值即熔断 (5 档可调)
breaker_t1_reqs       300     # 1 秒窗口
breaker_t2_reqs       500     # 3 秒窗口
breaker_t3_reqs       1200    # 10 秒窗口
breaker_cooldown_sec  30      # 熔断冷却 (秒)

# ---- JS 挑战 ----
# 挑战有效期为 challenge_ttl 秒，签名为 HMAC-SHA256 (AEGIS_KEY)
challenge_ttl         600
challenge_retries     3       # 挑战失败/超时返回 403 前的尝试次数

# ---- WAF 规则 ----
# 规则文件: /opt/aegis/rules/waf-rules.json
waf_rules_file        "/opt/aegis/rules/waf-rules.json"
waf_action            deny    # deny=拦截并返回403  /  log=仅记录
waf_block_sec         3600    # 命中规则后的动态封禁时长 (秒)

# ---- 扫描器/恶意 UA 拦截 ----
bot_ua_block          on

# ---- 系统加固 ----
# 以下项在 deploy.sh 中已自动应用，可手动调整后重跑对应脚本
# scripts/kernel-tune.sh  内核网络参数
# scripts/firewall.sh     iptables/nftables 规则
# scripts/ssh-guard.sh    SSH 暴力破解防护

# ---- 蜜罐路径（可选：诱捕扫描器/后台探测者，命中即记录并403）----
honeypot_paths        ""      # 例如 "/admin,/phpmyadmin,/manager,/wp-admin,/actuator"（默认关闭，避免误伤）

# ---- UA 聚合熔断（分布式 CC：多 IP 同 UA 洪水）----
enable_ua_flow        on
ua_flow_max           200     # 同一 UA 每 5 秒窗口超过则触发全局限流

# ---- 告警 (Python 守护进程使用) ----
alert_enable           off
alert_webhook          ""      # 例如 https://oapi.dingtalk.com/robot/send?access_token=xxx
alert_webhook_type     ding    # ding | feishu | wecom | generic
alert_email            ""      # SMTP 告警 (可选，需配置下方 SMTP)
smtp_host              ""
smtp_port              465
smtp_user              ""
smtp_pass              ""
alert_threshold        100     # 1 分钟内攻击次数超过 N 时告警
